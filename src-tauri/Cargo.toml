[package]
name = "neotypst"
version = "0.1.0"
description = "Ein Typst-Editor für Arbeitsblätter und Dokumentationen"
license = "MIT"
edition = "2024"

[lib]
name = "neotypst_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
dirs = "6"
chrono = "0.4"
hayagriva = "0.10"
ureq = { version = "2", features = ["gzip", "json"] }

typst = "0.15.1"
typst-layout = "0.15.1"
typst-svg = "0.15.1"
typst-pdf = "0.15.1"
typst-ide = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = [
    "embedded-fonts",
    "scan-fonts",
    "system-packages",
    "universe-packages",
    "system-downloader",
    "datetime",
] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSpellChecker"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSRange", "NSFileManager", "NSURL", "NSError"] }
